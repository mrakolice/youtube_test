[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-auth-service"
version = "0.1.0"
description = "Authentication service for YouTube clone"
requires-python = ">=3.11"
# Lower bounds only: every pin here must keep resolving on the newest CPython,
# so the exact versions live in uv.lock rather than in this file.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    # PyJWT replaces python-jose, which is unmaintained and pins an ancient
    # pyasn1/rsa stack that conflicts with current cryptography releases.
    "pyjwt[crypto]>=2.10",
    # pwdlib replaces passlib, which is unmaintained and imports the stdlib
    # crypt module removed in Python 3.13.
    "pwdlib[bcrypt]>=0.2.1",
    "python-multipart>=0.0.20",
    # aioredis was merged into redis-py; its asyncio client is redis.asyncio.
    "redis>=5.2",
    "aiokafka>=0.12",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    # tests/conftest.py runs against sqlite+aiosqlite:///:memory:
    "aiosqlite>=0.20",
    "sqlalchemy-declarative-extensions>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Required from pytest-asyncio 0.25 on; without it every run warns and future
# versions change the default.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]
